<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Réservation — KentraPix</title>
  <meta name="description" content="Demandez une séance photo avec KentraPix.">
  <meta name="theme-color" content="#1265d8">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="KentraPix">
  <meta property="og:title" content="Réservation — KentraPix">
  <meta property="og:description" content="Demandez une séance photo avec KentraPix.">
  <meta property="og:image" content="https://kentrapix.kenleyelysee.com/logo/og-image.png">
  <link rel="icon" type="image/svg+xml" href="/logo/kentrapix-icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png">
  <link rel="apple-touch-icon" href="/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="/css/portfolio.css">
</head>
<body>
  <header class="pf-bar">
    <a class="pf-brand" href="/studio"><img src="/logo/kentrapix-icon.svg" alt="" width="34" height="34"><span>Kentra<b>Pix</b></span></a>
    <nav>
      <a href="/photographes">Photographes</a>
      <a href="/studio" data-public-portfolio>Portfolio</a>
      <a href="/login" class="pf-ghost">Espace client</a>
    </nav>
  </header>

  <main>
    <section id="reserver" class="pf-section pf-book">
      <div class="pf-book-copy">
        <h1>Réservez votre séance</h1>
        <p>Dites-nous ce que vous imaginez. Vous recevez une réponse rapide, sans créer de compte.</p>
        <a class="pf-wa" id="wa" href="https://wa.me/50935022418" target="_blank" rel="noopener"> WhatsApp</a>
      </div>
      <form id="form" class="pf-form" novalidate>
        <label>Nom<input name="name" autocomplete="name" required maxlength="80"></label>
        <label>E-mail <span class="pf-opt">(facultatif)</span><input name="email" type="email" autocomplete="email" maxlength="190"></label>
        <label>Téléphone / WhatsApp<input name="phone" type="tel" autocomplete="tel" inputmode="tel" required maxlength="40" placeholder="+509 …"></label>
        <label>Photographe<select name="staffId" id="photographer" required></select></label>
        <label>Mois<input id="booking-month" type="month" required></label>
        <div class="pf-two">
          <label>Date disponible<select name="date" id="wish" required></select></label>
          <label>Heure disponible<select name="time" id="wishtime" required></select></label>
        </div>
        <label>Type de séance<select name="sessionType" id="types" required><option value="">Choisir…</option></select></label>
        <fieldset class="pf-pick" id="placePick" hidden>
          <legend>Où voulez-vous les photos ?</legend>
          <label><input type="radio" name="placeMode" value="studio" checked> Au studio</label>
          <label><input type="radio" name="placeMode" value="away"> À un autre endroit</label>
        </fieldset>
        <label id="placeRow" hidden>Lieu de la séance <span class="pf-req">*</span><input name="location" id="place" maxlength="120" autocomplete="street-address" placeholder="Ex. Pétion-Ville, Église Saint-Pierre…"></label>
        <label class="pf-check" id="placeTbdRow" hidden><input type="checkbox" id="placeTbd"> Le lieu reste à déterminer</label>
        <p class="pf-hint" id="placeHint" hidden></p>
        <label>Message<textarea name="message" rows="4" maxlength="1000" placeholder="Nombre de personnes, idées, détails…"></textarea></label>
        <input name="website" class="pf-trap" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="pf-btn" type="submit" id="send" disabled>Envoyer ma demande</button>
        <p class="pf-msg" id="msg" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="pf-foot">© <span id="year"></span> KentraPix · <a href="/conditions">Conditions</a> · <a href="/login">Espace client</a></footer>

  <script src="/js/public-links.js" defer></script>
  <script src="/js/reservation.js" defer></script>
</body>
</html>
