<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1265d8">
  <title>Page introuvable · KentraPix</title>
  <script src="/js/theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="/logo/kentrapix-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/dark.css">
  <style>
    body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 16px; background: var(--gradient-sidebar); }
    .lost { width: min(440px, 100%); padding: 40px 32px; border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-lg); text-align: center; }
    .lost img { width: 64px; height: 64px; }
    .lost .code { margin: 20px 0 4px; color: var(--blue); font-family: var(--font-display); font-size: 4.5rem; line-height: 1; }
    .lost h1 { margin: 0 0 8px; font-size: var(--text-xl); }
    .lost p { margin: 0 0 28px; color: var(--muted); }
    .lost a { display: inline-flex; padding: 12px 22px; border-radius: var(--radius-full); background: var(--gradient-primary); box-shadow: var(--shadow-btn); color: #fff; font-weight: 600; text-decoration: none; }
    .lost a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="lost">
    <img src="/logo/kentrapix-icon.svg" alt="KentraPix">
    <p class="code">404</p>
    <h1>Page introuvable</h1>
    <p>Ce lien n’existe pas ou a expiré. Si on vous a envoyé ce lien, demandez-en un nouveau à votre photographe.</p>
    <a href="/">Retour à mes photos</a>
  </main>
</body>
</html>
