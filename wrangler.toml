name = "kentrapix"
main = "deploy/cloudflare/worker.js"
compatibility_date = "2026-11-20"
workers_dev = false
routes = [
  { pattern = "kentrapix.kenleyelysee.com/*", zone_name = "kenleyelysee.com" }
]

[build]
command = "node scripts/build-pages.js"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[images]
binding = "IMAGES"
