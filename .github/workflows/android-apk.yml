name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['apps/mobile/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npm install --no-save @capacitor/assets && npx capacitor-assets generate --android --iconBackgroundColor '#1265d8' --iconBackgroundColorDark '#1265d8'
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Publier KentraPix.apk
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KentraPix.apk
          gh release delete android --cleanup-tag -y || true
          gh release create android KentraPix.apk --title "KentraPix pour Android" --notes "Téléchargez KentraPix.apk puis ouvrez-le pour l'installer." --latest
