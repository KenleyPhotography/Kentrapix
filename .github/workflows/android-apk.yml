name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['apps/mobile/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Sans Firebase, retirer le plugin de notifications (il ferait planter l'application)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -z "$GOOGLE_SERVICES_JSON" ]; then npm uninstall @capacitor/push-notifications; fi
      - run: npx cap add android
      - name: Sécurité Android (pas de sauvegarde cloud des données de l'application)
        run: sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
      - name: Ikon notifikasyon KentraPix (K blan nan ba notifikasyon an)
        run: cp -r res/. android/app/src/main/res/
      - name: Configuration Firebase (notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; else echo "Pas de GOOGLE_SERVICES_JSON : APK sans notifications."; fi
      - run: npm install --no-save @capacitor/assets && npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Clé de signature stable (sinon chaque APK a une signature différente et Android refuse la mise à jour)
        run: |
          mkdir -p ~/.android signing
          if [ ! -f signing/debug.keystore ]; then
            keytool -genkeypair -keystore signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=KentraPix,O=KentraPix,C=HT"
          fi
          cp signing/debug.keystore ~/.android/debug.keystore
      - run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Déposer l'APK dans le site (servi par /KentraPix.apk)
        working-directory: .
        run: |
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/KentraPix.apk"
          cp apps/mobile/signing/debug.keystore "$RUNNER_TEMP/debug.keystore"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4; do
            git fetch -q origin master
            git reset -q --hard origin/master   # repart du dernier état : pas de conflit si d'autres commits sont arrivés pendant le bati
            mkdir -p downloads apps/mobile/signing
            cp "$RUNNER_TEMP/KentraPix.apk" downloads/KentraPix.apk
            cp "$RUNNER_TEMP/debug.keystore" apps/mobile/signing/debug.keystore
            git add -f downloads/KentraPix.apk apps/mobile/signing/debug.keystore
            git commit -q -m "APK Android mis à jour [skip ci]" || exit 0
            git push -q origin HEAD:master && exit 0
            sleep 5
          done
          exit 1
      - name: Publier KentraPix.apk
        continue-on-error: true # facultatif : le site sert déjà l'APK
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KentraPix.apk
          gh release delete android --cleanup-tag -y || true
          gh release create android KentraPix.apk --title "KentraPix pour Android" --notes "Téléchargez KentraPix.apk puis ouvrez-le pour l'installer." --latest
